  // --- Sounds: alles per Web Audio API synthetisiert, keine Audiodateien noetig ---
  let audioCtx = null;
  function getCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }
  function tone(freq, duration, type, delay) {
    delay = delay || 0;
    try {
      const ctx = getCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type || 'sine';
      osc.frequency.value = freq;
      const t0 = ctx.currentTime + delay;
      gain.gain.setValueAtTime(0, t0);
      gain.gain.linearRampToValueAtTime(0.22, t0 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t0);
      osc.stop(t0 + duration + 0.05);
    } catch (e) { /* Web Audio evtl. nicht verfuegbar */ }
  }
  // eigene Klangdateien, mit synthetischem Ton als Rueckfallebene falls die Datei fehlt
  function playGainSound() { playClip(SND_GAIN); }
  function playCorrectionSound() { playClip(SND_CORRECTION); }
  function playSpendSound() { tone(660, 0.18, 'triangle'); tone(440, 0.22, 'triangle', 0.09); }
  function playLevelUpFanfare() { playClip(SND_LEVELUP, 0.7); }

  // --- leises Ambient-Summen im Hintergrund, ebenfalls per Web Audio synthetisiert ---
  let ambience = null;
  let musicOn = false; // Musik startet NICHT automatisch mehr (31.7.2026: Autoplay entfernt,
  // da hängende Audio-Prozesse beim Schliessen zu Problemen mit dem Cowork-VM-Service fuehrten).
  // Einschalten weiterhin jederzeit per Musik-Knopf moeglich.

  function startAmbience() {
    const ctx = getCtx();
    const master = ctx.createGain();
    // 0.05 war der bisherige Fixwert bei Standard-Lautstaerke 0.35, skaliert
    // jetzt proportional mit dem Lautstaerkeregler mit.
    master.gain.value = 0.05 * (state.musicVolume / 0.35);
    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 800;
    master.connect(filter).connect(ctx.destination);

    const freqs = [110, 164.81, 220]; // A2, E3, A3 - warmer, ruhiger Klang
    const oscs = freqs.map((f, i) => {
      const osc = ctx.createOscillator();
      osc.type = 'sine';
      osc.frequency.value = f;
      const g = ctx.createGain();
      g.gain.value = 0.5;
      osc.connect(g).connect(master);
      const lfo = ctx.createOscillator();
      lfo.frequency.value = 0.05 + i * 0.02;
      const lfoGain = ctx.createGain();
      lfoGain.gain.value = 1.2;
      lfo.connect(lfoGain).connect(osc.frequency);
      lfo.start();
      osc.start();
      return { osc, lfo };
    });

    const swell = ctx.createOscillator();
    swell.frequency.value = 0.04;
    const swellGain = ctx.createGain();
    swellGain.gain.value = 0.015;
    swell.connect(swellGain).connect(master.gain);
    swell.start();

    ambience = { master, filter, oscs, swell };
  }

  function stopAmbience() {
    if (!ambience) return;
    ambience.oscs.forEach(o => { o.osc.stop(); o.lfo.stop(); });
    ambience.swell.stop();
    ambience = null;
  }

  // echte Hintergrundmusik (mp3, lokal im Musik-Ordner); synthetisches Summen
  // dient nur als Rueckfallebene, falls die Datei mal fehlt/nicht laedt

  // Lautstaerkeregler unter dem Musik-Knopf. Wirkt auf die echte
  // Hintergrundmusik UND (proportional) auf die synthetische Ambience, falls
  // die mp3 mal nicht abspielbar ist. Wert wird gespeichert, bleibt also auch

  function setMusicVolume(val) {

  // Fisher-Yates, damit die Durchmischung wirklich gleichverteilt zufaellig ist
  // (nicht Math.random() als Sortier-Vergleichsfunktion, das ist verzerrt)
  function shuffled(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function buildGroups() {
    const names = state.gruppenNames || [];
    const size = state.gruppenSize || 3;
    if (names.length < 2) {
      alert('Es braucht mindestens 2 Namen, um Gruppen zu bilden.');
      return;
    }
    // Fabian will Gruppen EINER GROESSE (z.B. "3er-Gruppen"), nicht eine feste
    // Anzahl Gruppen. Anzahl Gruppen wird daraus abgeleitet: so viele Gruppen,
    // dass die durchschnittliche Groesse moeglichst nah an "size" liegt, dann
    // gleichmaessig verteilt (Groessen unterscheiden sich um maximal 1). Bei
    // z.B. 10 Namen und "3er" ergibt das 3 Gruppen (4,3,3) statt 4 Gruppen
    // (3,3,2,2), also wirklich Gruppen "von ungefaehr 3", nicht "irgendwie 3
    // Gruppen".
    let numGroups = Math.max(1, Math.round(names.length / size));
    // Einzelkind-Gruppen vermeiden: z.B. 9 Namen bei "2er" waeren sonst
    // 2,2,2,2,1 (jemand allein). Lieber eine Gruppe weniger, dafuer etwas
    // groesser, als ein Kind alleine lassen.
    while (numGroups > 1 && Math.floor(names.length / numGroups) < 2) {
      numGroups--;
    }
    const mixed = shuffled(names);
    const groups = Array.from({ length: numGroups }, () => []);
    mixed.forEach((name, i) => groups[i % numGroups].push(name));
    state.gruppenResult = groups;
    saveState();
    renderGruppen();
  }

  function svgSlicePoint(deg, r) {
    const rad = deg * Math.PI / 180;
    return [r * Math.sin(rad), -r * Math.cos(rad)];
  }

  // Rad-Groesse wird aus dem TATSAECHLICH verfuegbaren Platz berechnet (Fenster-
  // hoehe minus Navbar minus Panel), nicht aus einem geratenen vh/vw-Prozentsatz.
  // Dadurch nutzt das Rad auf einem grossen Monitor den ganzen freien Platz aus
  // (statt unnoetig klein zu bleiben), schrumpft aber auf kleinen Fenstern/Handys
  // trotzdem sauber genug, um nicht abgeschnitten zu werden.
  function updateRadFrameSize() {
    const frame = document.getElementById('rad-frame');
    if (!frame) return;

    const cs = getComputedStyle(document.documentElement);
    const topClearance = parseInt(cs.getPropertyValue('--top-clearance')) || 100;
    const bottomPad = 40;
    const sidePad = 40;
    const panelWidth = 280; // Panel (260px) + etwas Sicherheitsabstand
    const gap = 46;
    const MIN = 260;
    const MAX = 900;

    const vw = window.innerWidth;
    const vh = window.innerHeight;

    // Fall A: Rad und Panel passen nebeneinander (wie im CSS per flex-wrap) -
    // dann darf das Rad die volle verfuegbare Hoehe UND Breite ausnutzen.
    const heightSideBySide = vh - topClearance - bottomPad;
    const widthSideBySide = vw - panelWidth - gap - sidePad;
    const sideBySideSize = Math.min(heightSideBySide, widthSideBySide, MAX);

    let size;
    if (sideBySideSize >= MIN) {
      size = sideBySideSize;
    } else {
      // Fall B: zu schmal fuer nebeneinander, CSS wrapt auf "Rad oben, Panel
      // darunter" - dann muss auch das Panel selbst noch Hoehe abbekommen.
      const panelHeightEstimate = 320;
      const heightStacked = vh - topClearance - panelHeightEstimate - gap - bottomPad;
      const widthStacked = vw - sidePad;
      size = Math.min(heightStacked, widthStacked, MAX);
    }
    size = Math.max(MIN, Math.round(size));
    frame.style.width = size + 'px';
  }

  function renderWheelSvgOnly() {
    const rotor = document.getElementById('wheel-rotor');
    if (!rotor) return;
    const names = state.wheelNames || [];
    updateRadFrameSize();
    rotor.innerHTML = '';
    if (names.length < 2) return;
    // Rad bewusst gross, bis nahe an den Goldrahmen des Hintergrundbilds
    // (Fabian: Rad war zu weit innen, verschenkt Platz vor der Verzierung).
    // Pixelgenau vermessen (31.7.2026): Zentrum (1411,773), Goldrahmen beginnt
    // bei r=647-666 je nach Winkel (Fit ueber 147 Randpunkte, Residuum +-9px).
    // r=640 laesst ueberall einen kleinen Sicherheitsabstand.
    const r = 640;
    const segAngle = 360 / names.length;
    // Namen radial, nahe am aeusseren Rand platziert (mehr Sehnenbreite pro Segment
    // als weiter innen). BEWUSST KEINE lokale 180-Grad-Korrektur fuer die untere
    // Haelfte (frueher hier vorhanden, aber falsch): das Rad dreht sich beim Spin,
    // und jeder Name kann am Zeiger (12 Uhr) landen. Die Gesamt-Rotation eines
    // Namens im Moment, in dem sein Segment am Zeiger steht, ist immer 0 (Spin-
    // Winkel + eigener Ruhewinkel heben sich exakt auf, siehe spinWheel()). Mit
    // einer zusaetzlichen lokalen Korrektur stuenden dadurch ausgerechnet die
    // Namen, die in Ruhestellung unten waren, verkehrt herum da, sobald sie
    // gewinnen. Ohne Korrektur ist jeder Name oben an 12 Uhr lesbar, in
    // Ruhestellung unten dafuer auf dem Kopf (Fabian: das ist so gewuenscht).
    const textRadiusFactor = 0.80;
    let fontSize = 34;
    if (names.length > 6) fontSize = 28;
    if (names.length > 10) fontSize = 22;
    if (names.length > 14) fontSize = 18;

    names.forEach((name, i) => {
      const color = WHEEL_COLORS[i % WHEEL_COLORS.length];
      const [ex, ey] = svgSlicePoint(segAngle, r);
      const largeArc = segAngle > 180 ? 1 : 0;
      const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      g.setAttribute('transform', `rotate(${i * segAngle})`);
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', `M 0 0 L 0 ${-r} A ${r} ${r} 0 ${largeArc} 1 ${ex} ${ey} Z`);
      path.setAttribute('fill', color);
      path.setAttribute('stroke', '#d4af37');
      path.setAttribute('stroke-width', '1.5');
      g.appendChild(path);
      rotor.appendChild(g);

      const midAngle = i * segAngle + segAngle / 2;
      const labelG = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      labelG.setAttribute('transform', `rotate(${midAngle})`);
      const textY = -r * textRadiusFactor;
      const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      text.setAttribute('x', '0');
      text.setAttribute('y', String(textY));
      text.setAttribute('text-anchor', 'middle');
      text.setAttribute('fill', WHEEL_TEXT_COLOR);
      text.setAttribute('font-size', String(fontSize));
      text.setAttribute('font-weight', '700');
      text.setAttribute('font-family', 'Georgia, serif');
      text.setAttribute('style', 'paint-order: stroke; stroke: rgba(20,12,4,0.75); stroke-width: 3px;');
      text.textContent = name;
      labelG.appendChild(text);
      rotor.appendChild(labelG);
    });
  }

  let wheelSpinAudioEl = null;
  function startWheelSpinSound() {
    stopWheelSpinSound();
    try {
      wheelSpinAudioEl = new Audio(SND_WHEEL_SPIN);
      wheelSpinAudioEl.volume = scaledEffectVolume(0.55);
      wheelSpinAudioEl.loop = true;
      wheelSpinAudioEl.play().catch(() => {});

  }
  function stopWheelSpinSound() {

      wheelSpinAudioEl = null;
    }
  }
  function playWheelFanfare() { playClip(SND_WINNER, 0.7); }

  function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

  function spinWheel() {
    if (wheelSpinning) return;
    const names = state.wheelNames || [];
    if (names.length < 2) {
      alert('Bitte mindestens 2 Namen eintragen, bevor gedreht wird.');
      return;
    }
    wheelSpinning = true;
    document.getElementById('spin-btn').disabled = true;
    document.getElementById('wheel-names').disabled = true;
    document.getElementById('wheel-result').classList.remove('show');
    startWheelSpinSound();

    const segAngle = 360 / names.length;
    const idx = Math.floor(Math.random() * names.length);
    const jitter = segAngle * 0.15 + Math.random() * segAngle * 0.7;
    const targetAngleAtPointer = idx * segAngle + jitter;
    const desiredMod = (360 - targetAngleAtPointer + 360) % 360;
    const currentMod = ((wheelAngle % 360) + 360) % 360;
    const delta = (desiredMod - currentMod + 360) % 360;
    const extraFullSpins = 5 + Math.floor(Math.random() * 3);
    const startAngle = wheelAngle;
    const endAngle = wheelAngle + extraFullSpins * 360 + delta;
    const duration = 4200;
    const startTime = performance.now();

    function frame(now) {
      const t = Math.min(1, (now - startTime) / duration);
      const eased = easeOutCubic(t);
      const current = startAngle + (endAngle - startAngle) * eased;
      wheelAngle = current;
      document.getElementById('wheel-rotor').setAttribute('transform', `rotate(${current})`);

      if (t < 1) {
        requestAnimationFrame(frame);
      } else {
        wheelSpinning = false;
        stopWheelSpinSound();
        document.getElementById('spin-btn').disabled = false;
        document.getElementById('wheel-names').disabled = false;
        showWheelResult(names[idx]);
      }
    }
    requestAnimationFrame(frame);
  }

  const CONFETTI_COLORS = ['#d4af37', '#e8c96a', '#fff3d0', '#b8860b', '#8a5a2b'];

  function spawnConfetti(container, count) {

      const dx = Math.cos(angle) * distance;
      const dy = Math.sin(angle) * distance - 40;
      el.style.setProperty('--dx', dx + 'px');
      el.style.setProperty('--dy', dy + 'px');
      el.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
      el.style.background = CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)];
      el.style.animationDelay = (Math.random() * 0.15) + 's';
      container.appendChild(el);
      setTimeout(() => el.remove(), 1600);
    }
  }

  function showWheelResult(name) {
    playWheelFanfare();
    const el = document.getElementById('wheel-result');
    el.innerHTML = '';
    const nameDiv = document.createElement('div');
    nameDiv.className = 'wheel-result-name';
    nameDiv.textContent = `🎉 ${name} 🎉`;
    const hint = document.createElement('div');
    hint.className = 'wheel-result-hint';
    hint.textContent = 'Antippen zum Schliessen';
    el.appendChild(nameDiv);
    el.appendChild(hint);
    el.classList.add('show');
    el.onclick = () => dismissWheelResult(name);
    const backdrop = document.getElementById('wheel-result-backdrop');
    backdrop.classList.add('show');
    backdrop.onclick = () => dismissWheelResult(name);
    spawnConfetti(el, 36);
  }

  function dismissWheelResult(name) {
    const el = document.getElementById('wheel-result');
    const backdrop = document.getElementById('wheel-result-backdrop');
    el.classList.remove('show');
    el.onclick = null;
    backdrop.classList.remove('show');
    backdrop.onclick = null;
    const idx = state.wheelNames.indexOf(name);
    if (idx !== -1) {
      state.wheelNames.splice(idx, 1);
      saveState();
      renderWheel();
    }
  }

  render();
  renderWheel();
  initMusic();
  updateTopClearanceSoon();
</script>

</body>
</html>
